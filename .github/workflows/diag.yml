name: diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv-gui
          .\.venv-gui\Scripts\python.exe -m pip install -e ".[gui,build,dev]"
      - name: test_ui verbose
        continue-on-error: true
        shell: pwsh
        run: |
          .\.venv-gui\Scripts\python.exe -X faulthandler -m pytest tests/test_ui.py -v -p no:cacheprovider
          Write-Host "EXITCODE=$LASTEXITCODE UIVERBOSE"
      - name: export case only
        continue-on-error: true
        shell: pwsh
        run: |
          .\.venv-gui\Scripts\python.exe -X faulthandler -m pytest "tests/test_ui.py::test_gui_loads_json_and_exports_the_visible_search_results" -v -p no:cacheprovider
          Write-Host "EXITCODE=$LASTEXITCODE UIEXPORTONLY"
      - name: other ui cases only
        continue-on-error: true
        shell: pwsh
        run: |
          .\.venv-gui\Scripts\python.exe -X faulthandler -m pytest tests/test_ui.py -v -p no:cacheprovider `
            --deselect "tests/test_ui.py::test_gui_loads_json_and_exports_the_visible_search_results"
          Write-Host "EXITCODE=$LASTEXITCODE UINONEXPORT"
