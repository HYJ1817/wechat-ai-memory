name: diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv-gui
          .\.venv-gui\Scripts\python.exe -m pip install -e ".[gui,build,dev]"
      - name: Per-file exit codes
        shell: pwsh
        run: |
          Get-ChildItem tests -Filter "test_*.py" | ForEach-Object {
            .\.venv-gui\Scripts\python.exe -m pytest $_.FullName -q
            Write-Host "EXITCODE=$LASTEXITCODE FILE=$($_.Name)"
          }
      - name: Full run exit code
        shell: pwsh
        run: |
          .\.venv-gui\Scripts\python.exe -m pytest -q
          Write-Host "EXITCODE=$LASTEXITCODE FULL"
      - name: Full run with faulthandler
        shell: pwsh
        run: |
          $env:PYTHONFAULTHANDLER = "1"
          .\.venv-gui\Scripts\python.exe -X faulthandler -m pytest -q
          Write-Host "EXITCODE=$LASTEXITCODE FULLFAULT"
